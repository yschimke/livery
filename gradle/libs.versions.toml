[versions]
kotlin = "2.4.21"
kotlinx-serialization = "1.12.0"
kotlinx-coroutines = "1.11.0"
# The *stable* Compose Multiplatform line: an app's Compose version is at least the one Livery is
# compiled against, and an Android app that pins the androidx Compose BOM (as most do) gets a
# NoSuchMethodError at runtime when Livery is built against a newer runtime than the BOM's. Move
# this only when rc-players and the stable BOM have.
compose-multiplatform = "1.12.2"
# The skiko (Skia) version compose-multiplatform resolves: livery-render ships its natives per platform.
skiko = "0.150.2"
rc-players = "3.5.1"
agp = "9.5.0"
# Baseline profiles (livery-baselineprofile/): the Gradle plugin and the macrobenchmark runtime ship
# together; keep them on one version.
androidx-benchmark = "1.5.0"
ktor = "3.6.1"
okio = "3.18.2"
maven-publish = "0.37.0"
# Glance Wear moves in lockstep with the Remote Compose alphas rc-players builds on.
glance-wear = "1.0.0-alpha22"
firebase-bom = "35.1.0"
sentry = "8.62.0"
datadog = "3.15.0"
amplitude = "1.36.0"
compose-remote = "1.0.0-alpha23"
robolectric = "4.17"
# The A2UI release train (androidx.a2ui:*, material3-a2ui) for livery-a2ui-compose's Android
# target, and the same release ported to Compose Multiplatform (yschimke/a2ui-catalog, vendor/) for
# its JVM target. Both move together: the port's version is <release>-cmp<portRevision>.
a2ui = "1.0.0-alpha01"
a2ui-cmp = "1.0.0-alpha01-cmp02"
robolectric-sdk35 = "15-robolectric-13954326-i7"
# Android 16 (API 36): the first launcher that plays RemoteViews draw instructions.
robolectric-sdk36 = "16-robolectric-13921718-i7"

[libraries]
okio = { module = "com.squareup.okio:okio", version.ref = "okio" }
okio-fakefilesystem = { module = "com.squareup.okio:okio-fakefilesystem", version.ref = "okio" }
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "kotlinx-serialization" }
kotlinx-coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "kotlinx-coroutines" }
kotlinx-coroutines-test = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "kotlinx-coroutines" }
kotlinx-coroutines-play-services = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-play-services", version.ref = "kotlinx-coroutines" }
firebase-bom = { module = "com.google.firebase:firebase-bom", version.ref = "firebase-bom" }
firebase-analytics = { module = "com.google.firebase:firebase-analytics" }
firebase-config = { module = "com.google.firebase:firebase-config" }
firebase-firestore = { module = "com.google.firebase:firebase-firestore" }
sentry = { module = "io.sentry:sentry", version.ref = "sentry" }
sentry-compose = { module = "io.sentry:sentry-compose-android", version.ref = "sentry" }
datadog-rum = { module = "com.datadoghq:dd-sdk-android-rum", version.ref = "datadog" }
amplitude-android = { module = "com.amplitude:analytics-android", version.ref = "amplitude" }

ktor-client-core = { module = "io.ktor:ktor-client-core", version.ref = "ktor" }
ktor-client-okhttp = { module = "io.ktor:ktor-client-okhttp", version.ref = "ktor" }
ktor-client-darwin = { module = "io.ktor:ktor-client-darwin", version.ref = "ktor" }
ktor-client-js = { module = "io.ktor:ktor-client-js", version.ref = "ktor" }
ktor-client-mock = { module = "io.ktor:ktor-client-mock", version.ref = "ktor" }
ktor-server-core = { module = "io.ktor:ktor-server-core", version.ref = "ktor" }
ktor-server-test-host = { module = "io.ktor:ktor-server-test-host", version.ref = "ktor" }
cmp-runtime = { module = "org.jetbrains.compose.runtime:runtime", version.ref = "compose-multiplatform" }
cmp-foundation = { module = "org.jetbrains.compose.foundation:foundation", version.ref = "compose-multiplatform" }
cmp-ui = { module = "org.jetbrains.compose.ui:ui", version.ref = "compose-multiplatform" }
cmp-ui-test = { module = "org.jetbrains.compose.ui:ui-test", version.ref = "compose-multiplatform" }
# Material 3 for livery-compose-material3: the newest stable Compose Multiplatform Material 3 (its
# later lines are alphas). An app on a newer Material 3 resolves to its own.
cmp-material3 = { module = "org.jetbrains.compose.material3:material3", version = "1.9.0" }
rc-players-bom = { module = "ee.schimke.composeai:rc-players-bom", version.ref = "rc-players" }
rc-player-compose = { module = "ee.schimke.composeai:rc-player-compose" }
rc-player-edit = { module = "ee.schimke.composeai:rc-player-edit" }
rc-widget-core = { module = "ee.schimke.composeai:rc-widget-core" }
rc-widget-launcher = { module = "ee.schimke.composeai:rc-widget-launcher" }
rc-player-protocol = { module = "ee.schimke.composeai:rc-player-protocol" }
rc-widget-creation = { module = "ee.schimke.composeai:rc-widget-creation" }
rc-widget-creation-androidx = { module = "ee.schimke.composeai:rc-widget-creation-androidx" }
rc-creation-compose = { module = "ee.schimke.composeai:rc-creation-compose" }
compose-remote-core = { module = "androidx.compose.remote:remote-core", version.ref = "compose-remote" }
compose-remote-player-core = { module = "androidx.compose.remote:remote-player-core", version.ref = "compose-remote" }
compose-remote-player-view = { module = "androidx.compose.remote:remote-player-view", version.ref = "compose-remote" }
compose-remote-player-compose = { module = "androidx.compose.remote:remote-player-compose", version.ref = "compose-remote" }
compose-remote-creation-compose = { module = "androidx.compose.remote:remote-creation-compose", version.ref = "compose-remote" }
robolectric = { module = "org.robolectric:robolectric", version.ref = "robolectric" }
robolectric-sdk35 = { module = "org.robolectric:android-all-instrumented", version.ref = "robolectric-sdk35" }
robolectric-sdk36 = { module = "org.robolectric:android-all-instrumented", version.ref = "robolectric-sdk36" }
android-gradle-api = { module = "com.android.tools.build:gradle-api", version.ref = "agp" }
glance-wear = { module = "androidx.glance.wear:wear", version.ref = "glance-wear" }
glance-wear-core = { module = "androidx.glance.wear:wear-core", version.ref = "glance-wear" }

a2ui-compose-ui = { module = "androidx.a2ui.compose:compose-ui", version.ref = "a2ui" }
a2ui-material3 = { module = "androidx.compose.material3:material3-a2ui", version.ref = "a2ui" }
a2ui-cmp-compose-ui = { module = "ee.schimke.a2uicmp:a2ui-compose-ui", version.ref = "a2ui-cmp" }
a2ui-cmp-material3 = { module = "ee.schimke.a2uicmp:material3-a2ui", version.ref = "a2ui-cmp" }
# Material 3 at the versions those POMs name (as runtime dependencies), for the theme roles.
a2ui-androidx-material3 = { module = "androidx.compose.material3:material3", version = "1.5.0-alpha28" }
a2ui-cmp-ui-test = { module = "org.jetbrains.compose.ui:ui-test", version = "1.13.0-alpha02" }
a2ui-cmp-material3-base = { module = "org.jetbrains.compose.material3:material3", version = "1.13.0-alpha02" }

androidx-activity-compose = { module = "androidx.activity:activity-compose", version = "1.13.0" }
androidx-emoji2 = { module = "androidx.emoji2:emoji2", version = "1.4.0" }
androidx-benchmark-macro-junit4 = { module = "androidx.benchmark:benchmark-macro-junit4", version.ref = "androidx-benchmark" }
androidx-test-ext-junit = { module = "androidx.test.ext:junit", version = "1.3.0" }
androidx-test-uiautomator = { module = "androidx.test.uiautomator:uiautomator", version = "2.4.1" }

[plugins]
kotlin-multiplatform = { id = "org.jetbrains.kotlin.multiplatform", version.ref = "kotlin" }
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
compose-multiplatform = { id = "org.jetbrains.compose", version.ref = "compose-multiplatform" }
compose-compiler = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
android-kmp-library = { id = "com.android.kotlin.multiplatform.library", version.ref = "agp" }
android-library = { id = "com.android.library", version.ref = "agp" }
android-application = { id = "com.android.application", version.ref = "agp" }
android-test = { id = "com.android.test", version.ref = "agp" }
androidx-baselineprofile = { id = "androidx.baselineprofile", version.ref = "androidx-benchmark" }
maven-publish = { id = "com.vanniktech.maven.publish", version.ref = "maven-publish" }
