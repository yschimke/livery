name: Benchmarks

# Flings the same feed of sample cards drawn as Livery templates and as their Compose UI twins
# (`:livery-benchmark`, livery-baselineprofile/README.md) on an API 34 emulator, and puts the two
# FrameTimingMetric results side by side in the job summary. An emulator's numbers are a rough
# comparison between the two, not a device's frame times. Not a required check.

on:
  pull_request:
    branches: [main]
    paths:
      - 'livery-compose/**'
      - 'livery-client/**'
      - 'livery-protocol/**'
      - 'livery-baselineprofile/**'
      - 'gradle/libs.versions.toml'
      - '.github/workflows/benchmarks.yml'
      - '.github/scripts/benchmark-summary.py'
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: benchmarks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  feed:
    name: Feed fling (API 34 emulator)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
      - name: Android SDK platform
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-37.1" > /dev/null
      - name: Build the host and benchmark before booting
        run: >-
          ./gradlew --stacktrace
          :livery-baselineprofile-host:assembleBenchmarkRelease
          :livery-benchmark:assembleBenchmarkRelease
      - name: Run the benchmark
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 34
          target: default
          arch: x86_64
          profile: pixel_6
          ram-size: 4096M
          disk-size: 4G
          emulator-boot-timeout: 900
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          # Macrobenchmark refuses an emulator unless told this is understood.
          script: >-
            ./gradlew --stacktrace :livery-benchmark:connectedBenchmarkReleaseAndroidTest
            -Pandroid.testInstrumentationRunnerArguments.androidx.benchmark.suppressErrors=EMULATOR
      - name: Summarize
        if: always()
        run: |
          python3 .github/scripts/benchmark-summary.py livery-baselineprofile/benchmark/build \
            | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Upload the results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: benchmark-results
          path: |
            livery-baselineprofile/benchmark/build/outputs/connected_android_test_additional_output/**
            livery-baselineprofile/benchmark/build/reports/androidTests/**
          if-no-files-found: warn
