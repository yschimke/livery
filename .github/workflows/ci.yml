name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# A pull request cancels its own superseded runs; a push to `main` never cancels anything (each
# push run is a group of one), so every commit on `main` gets a completed run.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'push' && github.run_id || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: Build and test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          # 17 builds; 21 is the toolchain livery-verify's tests run Robolectric's Android 16 on.
          java-version: |
            21
            17
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
      # compileSdk 37.1 (Compose Multiplatform 1.13, OkHttp 5); the runner image may not carry it yet.
      - name: Android SDK platform
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-37.1" > /dev/null
      - name: Build and test every target, then build the sample catalog
        run: |
          ./gradlew build :livery-publish:installDist :livery-mcp:installDist
          livery-publish/build/install/livery/bin/livery build samples/catalog build/sample-catalog
      # The CLI just built, for the reusable catalog workflows' self-tests below.
      - name: Upload the livery CLI
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: livery-cli
          path: livery-publish/build/install/livery
      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-reports
          path: '**/build/reports/tests/'

  # Which parts of the repository a change touches. macOS runners are scarce on the shared pool, so
  # the Swift job runs (and gates merging) only for changes that can affect it.
  changes:
    name: Changed paths
    runs-on: ubuntu-latest
    outputs:
      swift: ${{ steps.paths.outputs.swift }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - id: paths
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          # Run Swift when the base can't be compared (a new branch, a dispatch): never skip by accident.
          if [ -z "$BASE" ] || [ -z "${BASE//0/}" ] || ! git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            echo "swift=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          if git diff --name-only "$BASE" HEAD | grep -qE '^(swift/|Package\.swift$|conformance/)'; then
            echo "swift=true" >> "$GITHUB_OUTPUT"
          else
            echo "swift=false" >> "$GITHUB_OUTPUT"
          fi

  # The Swift package: native URLSession and CryptoKit, run against the same conformance fixtures.
  swift:
    name: Swift package
    needs: changes
    if: ${{ needs.changes.outputs.swift == 'true' }}
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: swift test (macOS)
        run: swift test
      - name: Build for iOS
        run: xcodebuild -scheme Livery-Package -destination 'generic/platform=iOS Simulator' -skipPackagePluginValidation build -quiet

  # The reusable workflows catalog repositories call (repository mode), run on the sample catalog
  # with the CLI this run built: a review without the pull request comment, and a publish with a
  # throwaway key that releases nothing.
  catalog-review:
    name: Catalog review workflow
    needs: build
    uses: ./.github/workflows/catalog-review.yml
    with:
      source: samples/catalog
      livery-artifact: livery-cli
      # The sample's documents are placeholders, apart from tile-default/in-app.rc.
      inspect: false
      comment: false
      # Runs `livery review` (the renderer in the CLI); with contents: read the images stay in the
      # run's artifact.
      previews: true
    permissions:
      contents: read

  catalog-publish:
    name: Catalog publish workflow
    needs: build
    uses: ./.github/workflows/catalog-publish.yml
    with:
      source: samples/catalog
      livery-artifact: livery-cli
      inspect: false
      key-id: dry-run
      dry-run: true
    permissions:
      contents: read

  # The one check the `Protect Main` ruleset requires (yschimke/renovate-config `repo-policy/`).
  # Add a job to `needs` instead of to the ruleset, so adding or renaming a job never wedges PRs.
  gradle:
    needs: [changes, build, swift, catalog-review, catalog-publish]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      # Every job must succeed, except that the Swift job may be skipped when no Swift-facing file
      # changed. A skip for any other reason (its dependency failed) still fails the gate.
      - name: Every gated job succeeded
        env:
          CHANGES: ${{ needs.changes.result }}
          BUILD: ${{ needs.build.result }}
          SWIFT: ${{ needs.swift.result }}
          SWIFT_NEEDED: ${{ needs.changes.outputs.swift }}
          REVIEW: ${{ needs.catalog-review.result }}
          PUBLISH: ${{ needs.catalog-publish.result }}
        run: |
          ok=true
          [ "$CHANGES" = success ] || ok=false
          [ "$BUILD" = success ] || ok=false
          [ "$REVIEW" = success ] || ok=false
          [ "$PUBLISH" = success ] || ok=false
          if [ "$SWIFT_NEEDED" = true ]; then [ "$SWIFT" = success ] || ok=false
          else [ "$SWIFT" = success ] || [ "$SWIFT" = skipped ] || ok=false; fi
          echo "changes=$CHANGES build=$BUILD swift=$SWIFT (needed: $SWIFT_NEEDED) review=$REVIEW publish=$PUBLISH"
          $ok || { echo "::error::A gated job did not succeed"; exit 1; }
