name: Baseline profiles

# Collects the baseline profile livery-protocol, livery-client and livery-compose ship in their
# AARs, on an emulator: `:livery-baselineprofile` flings `:livery-baselineprofile-host` through the
# sample catalog. The filtered profiles come out as the `baseline-profiles` artifact (and as a base64
# tarball in the log); commit them over each module's `src/androidMain/generated/baselineProfiles/`.
# The workflow never commits itself: a push made with its token would land without CI. See
# livery-baselineprofile/README.md.

on:
  pull_request:
    branches: [main]
    paths:
      - 'livery-baselineprofile/**'
      - '.github/workflows/baseline-profiles.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: baseline-profiles-${{ github.ref }}
  cancel-in-progress: true

jobs:
  generate:
    name: Generate (API 34 emulator)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
      - name: Android SDK platform
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-37.1" > /dev/null
      - name: Build the host and generator before booting
        run: >-
          ./gradlew --stacktrace
          :livery-baselineprofile-host:assembleNonMinifiedRelease
          :livery-baselineprofile:assembleNonMinifiedRelease
      - name: Generate the profiles
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 34
          target: default
          arch: x86_64
          profile: pixel_6
          ram-size: 4096M
          disk-size: 4G
          emulator-boot-timeout: 900
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          # One collection; each library's task filters it to its own packages.
          script: >-
            ./gradlew --stacktrace
            :livery-protocol:generateBaselineProfile
            :livery-client:generateBaselineProfile
            :livery-compose:generateBaselineProfile
      - name: Summarize the profiles
        if: always()
        run: |
          {
            echo "### Baseline profiles"
            find . -path '*/src/androidMain/generated/baselineProfiles/*.txt' -not -path './.git/*' -exec wc -l {} + \
              || echo "No profile generated."
          } >> "$GITHUB_STEP_SUMMARY"
      # The same profiles as a base64 tarball in the log, for readers that can reach job logs but
      # not artifacts.
      - name: Print the profiles
        run: |
          echo "BASELINE-PROFILES-BEGIN livery"
          tar czf - livery-*/src/androidMain/generated/baselineProfiles | base64 -w 0
          echo
          echo "BASELINE-PROFILES-END livery"
      - name: Upload the profiles
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: baseline-profiles
          path: livery-*/src/androidMain/generated/baselineProfiles/**
          if-no-files-found: warn
      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: baseline-profile-test-results
          path: |
            livery-baselineprofile/generator/build/outputs/androidTest-results/**
            livery-baselineprofile/generator/build/reports/androidTests/**
          if-no-files-found: warn
